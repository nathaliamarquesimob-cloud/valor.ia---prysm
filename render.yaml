services:
  - type: web
    name: valor-ia-prysm
    env: node
    plan: free
    region: oregon
    buildCommand: |
      cd backend
      npm install
    startCommand: |
      cd backend
      npm start
    envVars:
      - key: PORT
        value: 8080
      - key: REPORT_BRAND_NAME
        value: "Valor.IA"
      - key: REPORT_BRAND_SLOGAN
        value: "Onde o valor ganha inteligência. E a inteligência, propósito."
    autoDeploy: true
